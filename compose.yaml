services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: springtask
      POSTGRES_USER: springtask
      POSTGRES_PASSWORD: ${DB_PASSWORD:-springtask_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springtask -d springtask"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
