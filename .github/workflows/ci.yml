name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 17 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: springtask_test
          POSTGRES_USER: springtask
          POSTGRES_PASSWORD: springtask_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U springtask -d springtask_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/springtask_test
      TEST_DB_USER: springtask
      TEST_DB_PASSWORD: springtask_ci_only
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Test and package
        run: bash gradlew --no-daemon --console=plain clean check bootJar
      - name: Save test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7
