<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
  <div layout:fragment="content">
    <a class="back-link" href="/">← К списку пользователей</a>
    <section class="card edit-card"><h1>Редактирование пользователя</h1><p class="muted">Измените контактные данные и сохраните карточку.</p>
    <form th:action="@{/user-edit/{id}(id=${userId})}" method="post" th:object="${userForm}">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" class="form-control" type="email" th:field="*{email}" maxlength="254" required>
        <div class="text-danger" th:errors="*{email}"></div>
      </div>
      <div class="mb-3">
        <label for="fullName" class="form-label">Имя</label>
        <input id="fullName" class="form-control" type="text" th:field="*{fullName}" maxlength="100" required>
        <div class="text-danger" th:errors="*{fullName}"></div>
      </div>
      <div class="mb-3">
        <label for="cityId" class="form-label">Город</label>
        <select id="cityId" class="form-select" th:field="*{cityId}">
          <option value="">Не указан</option>
          <option th:each="city : ${cities}" th:value="${city.id}" th:text="${city.name}"></option>
        </select>
        <div class="text-danger" th:errors="*{cityId}"></div>
      </div>
      <button class="btn btn-primary">Сохранить изменения</button>
      <a class="btn btn-light" href="/">Отмена</a>
    </form>
    <hr>
    <form th:action="@{/user-delete/{id}(id=${userId})}" method="post" data-confirm="Удалить пользователя? Это действие нельзя отменить.">
      <button class="btn btn-danger">Удалить пользователя</button>
    </form></section>
  </div>
</html>
