spring.config.import=optional:file:./.env.local[.properties]
server.port=${SERVER_PORT:8000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/springtask}
spring.datasource.username=${DB_USER:springtask}
spring.datasource.password=${DB_PASSWORD:springtask_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
